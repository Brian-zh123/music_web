<style>

.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{font-size:11px;letter-spacing:.28em;color:var(--accent);font-weight:800}.tag{font-size:11px;color:#aeb8c5;letter-spacing:.12em;border:1px solid #ffffff24;border-radius:99px;padding:8px 12px}

.controls{display:flex;align-items:center;gap:15px}.play{width:48px;height:48px;border:0;border-radius:50%;background:var(--accent);color:#080b12;font-size:18px;font-weight:900;cursor:pointer;flex:none}
.time{font-variant-numeric:tabular-nums;color:#dce4ed;font-size:12px;min-width:84px}.right{margin-left:auto;display:flex;gap:12px;align-items:center}

input[type=range]{accent-color:var(--accent);cursor:pointer}.seek{width:100%;margin:15px 0 10px}.bottom{display:flex;justify-content:space-between;align-items:center;color:#84909e;font-size:11px;letter-spacing:.08em}

</style></head>

S"}, {"t": 99.0, "end": 103.5, "text": "Running, running, hear my heartbeat call", "section": "CHORUS"}, {"t": 103.5, "end": 108.0, "text": "I was made to run, I was made for it all!", "section": "CHORUS"}, {"t": 108.0, "end": 112.5, "text": "Run! Run! Run!", "section": "INSTRUMENTAL DROP"}, {"t": 112.5, "end": 117.0, "text": "Move your body, feel the sun!", "section": "INSTRUMENTAL DROP"}, {"t": 117.0, "end": 121.5, "text": "Run! Run! Run!", "section": "INSTRUMENTAL DROP"}, {"t": 121.5, "end": 126.0, "text": "We are never coming undone!", "section": "INSTRUMENTAL DROP"}, {"t": 126.0, "end": 130.5, "text": "But now the morning feels so cold", "section": "VERSE 2"}, {"t": 130.5, "end": 135.0, "text": "My tired legs don’t do what they’re told", "section": "VERSE 2"}, {"t": 135.0, "end": 139.5, "text": "The road is there, just like before", "section": "VERSE 2"}, {"t": 139.5, "end": 144.0, "text": "But I can’t chase it anymore", "section": "VERSE 2"}, {"t": 144.0, "end": 148.5, "text": "The years have written on my skin", "section": "VERSE 2"}, {"t": 148.5, "end": 153.0, "text": "A fading fire deep within", "section": "VERSE 2"}, {"t": 153.0, "end": 157.5, "text": "I hear the footsteps in my mind", "section": "VERSE 2"}, {"t": 157.5, "end": 162.0, "text": "But leave my younger self behind", "section": "VERSE 2"}, {"t": 162.0, "end": 168.0, "text": "I try to run, I try to fly", "section": "PRE-CHORUS 2"}, {"t": 168.0, "end": 174.0, "text": "But every step reminds me why", "section": "PRE-CHORUS 2"}, {"t": 174.0, "end": 180.0, "text": "The body fades, the dreams remain", "section": "PRE-CHORUS 2"}, {"t": 180.0, "end": 186.0, "text": "I miss the rhythm, miss the pain", "section": "PRE-CHORUS 2"}, {"t": 186.0, "end": 192.0, "text": "Oh, where did all the fast days go?", "section": "EMOTIONAL BREAK"}, {"t": 192.0, "end": 198.0, "text": "Where is the fire I used to know?", "section": "EMOTIONAL BREAK"}, {"t": 198.0, "end": 204.0, "text": "If I can’t run the way I did…", "section": "EMOTIONAL BREAK"}, {"t": 204.0, "end": 210.0, "text": "Does that mean the race is over?", "section": "EMOTIONAL BREAK"}, {"t": 210.0, "end": 212.67, "text": "No!", "section": "BUILD-UP"}, {"t": 212.67, "end": 215.33, "text": "I can still hear the sound", "section": "BUILD-UP"}, {"t": 215.33, "end": 218.0, "text": "Of my heartbeat shaking the ground", "section": "BUILD-UP"}, {"t": 218.0, "end": 220.67, "text": "No!", "section": "BUILD-UP"}, {"t": 220.67, "end": 223.33, "text": "Even if my steps are slow", "section": "BUILD-UP"}, {"t": 223.33, "end": 226.0, "text": "There’s still a road I wanna go!", "section": "BUILD-UP"}, {"t": 226.0, "end": 228.67, "text": "One more breath!", "section": "BUILD-UP"}, {"t": 228.67, "end": 231.33, "text": "One more stride!", "section": "BUILD-UP"}, {"t": 231.33, "end": 234.0, "text": "There’s still a runner deep inside!", "section": "BUILD-UP"}, {"t": 234.0, "end": 238.5, "text": "I’m running, running, running through my life", "section": "FINAL CHORUS"}, {"t": 238.5, "end": 243.0, "text": "Even when the road is hard, I’ll fight the fight", "section": "FINAL CHORUS"}, {"t": 243.0, "end": 247.5, "text": "I’m running, running, slower but still strong", "section": "FINAL CHORUS"}, {"t": 247.5, "end": 252.0, "text": "Every breath I take will carry me along", "section": "FINAL CHORUS"}, {"t": 252.0, "end": 256.5, "text": "Oh-oh-oh, I won’t give in", "section": "FINAL CHORUS"}, {"t": 256.5, "end": 261.0, "text": "Oh-oh-oh, let life begin", "section": "FINAL CHORUS"}, {"t": 261.0, "end": 265.5, "text": "I don’t need to run as fast as yesterday", "section": "FINAL CHORUS"}, {"t": 265.5, "end": 270.0, "text": "I’ll keep on running in my own way!", "section": "FINAL CHORUS"}, {"t": 270.0, "end": 272.25, "text": "Run… run…", "section": "OUTRO"}, {"t": 272.25, "end": 274.5, "text": "As long as I’m alive…", "section": "OUTRO"}, {"t": 274.5, "end": 276.75, "text": "Run… run…", "section": "OUTRO"}, {"t": 276.75, "end": 279.0, "text": "I’ll never say goodbye…", "section": "OUTRO"}, {"t": 279.0, "end": 281.25, "text": "I’m still running…", "section": "OUTRO"}, {"t": 281.25, "end": 283.5, "text": "I’m still running…", "section": "OUTRO"}, {"t": 283.5, "end": 285.75, "text": "For life.", "section": "OUTRO"}, {"t": 285.75, "end": 288.0, "text": "For life.", "section": "OUTRO"}];
const audio=document.getElementById('audio'), play=document.getElementById('play'), seek=document.getElementById('seek');
const lyrics=document.getElementById('lyrics'), section=document.getElementById('section'), clock=document.getElementById('clock');
const hint=document.getElementById('hint'), percent=document.getElementById('percent');
let current=-1, dragging=false;
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function mood(t){document.body.classList.toggle('melancholy',t>=126&&t<234);document.body.classList.toggle('final',t>=234);}
let lastPulse=-1;
function render(t){
 let i=cues.findIndex(c=>t>=c.t&&t<c.end); if(i<0)i=t<cues[0].t?0:cues.length-1;
 if(i!==current){current=i;const c=cues[i];section.textContent=c.section; section.style.animation='none'; void section.offsetWidth; section.style.animation=''; document.body.classList.remove('pulse'); void document.body.offsetWidth; document.body.classList.add('pulse'); setTimeout(()=>document.body.classList.remove('pulse'),720);
  lyrics.innerHTML='';
  [i-1,i,i+1].forEach((n,k)=>{if(n>=0&&n<cues.length){let d=document.createElement('div');d.className='line '+(k===0?'prev':k===1?'active':'next');d.textContent=cues[n].text;lyrics.appendChild(d)}});
  hint.textContent=c.section==='VERSE 2'?'Some roads become memories.':c.section==='BUILD-UP'?'One more breath. One more stride.':c.section==='FINAL CHORUS'?'The rhythm never really leaves.':'Feel the rhythm. Follow the light.';
 }
 document.body.classList.toggle('drop',cues[i]?.section==='CHORUS'||cues[i]?.section==='FINAL CHORUS'||cues[i]?.section==='INSTRUMENTAL DROP');
 mood(t);
}
function tick(){let t=audio.currentTime;render(t);clock.textContent=fmt(t)+' / '+fmt(audio.duration||288);if(!dragging)seek.value=t;percent.textContent=Math.round(t/(audio.duration||288)*100)+'%'}
play.addEventListener('click', async () => {
  if (!audio.paused) { audio.pause(); return; }
  hint.textContent = '正在加载音乐…';
  try {
    if (audio.networkState === HTMLMediaElement.NETWORK_EMPTY) audio.load();
    await audio.play();
    hint.textContent = '音乐播放中 · Follow the rhythm';
  } catch (err) {
    console.error('Audio playback failed:', err);
    if (err && err.name === 'NotAllowedError') {
      hint.textContent = '浏览器阻止了播放，请再点击一次播放按钮。';
    } else if (err && err.name === 'NotSupportedError') {
      hint.textContent = 'Edge 无法识别音频格式，请确认 MP3 文件完整且未被改名。';
    } else {
      hint.textContent = '播放失败（' + (err?.name || '未知错误') + '）。请确认 MP3 与 index.html 在同一文件夹，并重新解压 ZIP。';
    }
  }
});
audio.addEventListener('error', () => {
  const code = audio.error ? audio.error.code : 0;
  const messages = {
    1: '音频加载被中断。请重新点击播放。',
    2: '读取音乐文件失败。请确认 MP3 与 index.html 在同一文件夹。',
    3: '音乐文件解码失败，可能文件不完整。',
    4: 'Edge 不支持当前音频源，请检查 MP3 文件。'
  };
  hint.textContent = messages[code] || '音乐加载失败。请确认已完整解压 ZIP 文件。';
});
audio.addEventListener('canplay', () => {
  if (audio.paused) hint.textContent = '音乐已准备好，点击播放开始';
});

audio.onplay=()=>play.textContent='Ⅱ';audio.onpause=()=>play.textContent='▶';audio.ontimeupdate=tick;
audio.onloadedmetadata=()=>{seek.max=audio.duration;tick()};
seek.oninput=()=>{dragging=true;clock.textContent=fmt(+seek.value)+' / '+fmt(audio.duration||288)};
seek.onchange=()=>{audio.currentTime=+seek.value;dragging=false;tick()};
document.getElementById('volume').oninput=e=>audio.volume=+e.target.value;
document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
audio.volume=.85;render(0);tick();
